<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html 연습</title>
</head>
<body>
    <h1>안녕하세요</h1>
    <h2>안녕하세요</h2>
    <h3>안녕하세요</h3>
    <h4>안녕하세요</h4>
    <h5>안녕하세요</h5>
    <h6>안녕하세요</h6>
    <hr>
     HTML <em>공부</em>를 시작합니다.<br>
    <strong>중요한 내용</strong>

    <p>HTML 공부를 시작합니다.</p>
    <strong>중요한 내용</strong><!--중요하다는 강조의 의미-->
    <hr>
    <p><b>굵은 글자</b></p><!--단순하게 글자를 굵게 표시-->
    <p><i>기울어진 글자</i></p><!--이텔릭체 글자를 기울여서 표시-->
    <p><u>밑줄이 있는 글자</u></p><!--밑줄을 표시해줌-->
    <p><del>삭제된 내용을 표시</del></p><!--삭제된(취소된) 내용을 표시-->
    <p><mark>형광펜 같은 글씨 효과</mark></p><!--형광펜처럼 강조-->
    
</body>
</html>
